<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/app.css">

    <title>Notificaciones</title>
</head>

<body>
    <div class="container-login">
        <div class="login">
            <h3 class="title">Enviar notificaciones</h3>
            <div class="content-login">
                <form class="form" id="notification-form">
                    <div class="input-group input-group-lg input-group mb-3">
                        <input type="text" class="form-control" aria-label="Sizing example input"
                            aria-describedby="inputGroup-sizing-lg" placeholder="Titulo" id="title">
                    </div>
                    <div class="input-group input-group-lg input-group mb-3">
                        <input type="text" class="form-control" aria-label="Sizing example input"
                            aria-describedby="inputGroup-sizing-lg" placeholder="Mensaje" id="body">
                    </div>
                <select class="form-select" aria-label="Default select example" id="target">
                    <option selected>A quien deseas enviarles</option>
                    <option value="ALL_USERS">Usuarios</option>
                    <option value="ALL_DRIVERS">Condutores</option>

                </select>
                <br>
                    <div id="message-container" style="display: none;"></div>
                <br>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success" type="submit">Enviar</button>
                    </div>
                    <br>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="js/controller/notifications/notificationController.js"></script>
</body>

</html>
