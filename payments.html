<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/movers.css">
    <title>Pagos </title>
</head>
<body>
    <div class="movers-register">
        <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Buscar un movers">
        <datalist id="datalistOptions">
            <option value="San Francisco">
            <option value="New York">
            <option value="Seattle">
            <option value="Los Angeles">
            <option value="Chicago">
        </datalist>
        <div class="movers">
            <table class="table table-dark table-hover">
                <thead class="table-light">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Mover</th>
                        <th scope="col">Saldo pendiente</th>
                        <th scope="col">Banco / metodo</th>
                        <th scope="col">Número de cuenta</th>
                        <th scope="col">Pagar</th>
                    </tr>
                </thead>
                <tbody id="movers-table-payments">
                    <tr>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script type="module" src="./js/controller/payment/paymentsController.js"></script>
</body>
</html>
